<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b13">
<meta name="robots" content="noindex">
<title>页面走丢了 — 雾晚</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0b13;color:#f3f1f8;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:520px;text-align:center}
.code{font-size:13px;letter-spacing:.28em;color:#a7a5b5;margin:0 0 18px}
h1{font-size:30px;line-height:1.3;margin:0 0 14px}
.gradient-text{background:linear-gradient(120deg,#8b7bff,#4fd1c5);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 26px;color:#a7a5b5;line-height:1.8;font-size:15px}
a.button{display:inline-block;padding:12px 22px;border-radius:999px;background:#f3f1f8;color:#0b0b13;text-decoration:none;font-weight:600}
a.quiet{display:inline-block;margin-left:16px;color:#a7a5b5;text-decoration:none;padding:12px 6px}
a:focus-visible{outline:2px solid #8b7bff;outline-offset:3px}
@media(max-width:520px){a.quiet{margin-left:0;display:block}}
</style>
</head>
<body>
<div class="wrap">
<p class="code">404 / NOT FOUND</p>
<h1>这一页<span class="gradient-text">不在地图上。</span></h1>
<p>你要找的地址可能已经搬走，或者从来没存在过。回到首页，五页内容都在。</p>
<a class="button" href="/">回到首页</a><a class="quiet" href="/#projects">看看项目</a>
</div>
</body>
</html>
