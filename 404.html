<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e8ebee" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex">
  <meta name="description" content="这个地址没有找到；回到雾晚的个人主页继续浏览。">
  <title>页面走丢了 — 雾晚</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('wuwan-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root,[data-theme="dark"]{--bg:#0b0c0f;--ink:#f4f1ea;--muted:#d3cec4;--accent:#f2b44c;--on-accent:#17120a}
    [data-theme="light"]{--bg:#e8ebee;--ink:#14161a;--muted:#2f333a;--accent:#9a4a00;--on-accent:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:0 clamp(20px,3.4vw,56px);background:var(--bg);color:var(--ink);font:400 17px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .rise{animation:rise .9s cubic-bezier(.22,.8,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
    .brand{display:inline-flex;align-items:center;gap:10px;width:fit-content;min-height:72px;font-size:19px;font-weight:700;letter-spacing:-.02em}
    .brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
    main{align-self:center;width:min(880px,100%);padding-block:64px}
    .code{margin:0 0 18px;color:var(--accent);font-size:15px;font-weight:650;letter-spacing:.14em;animation-delay:.08s}
    h1{margin:0 0 22px;font-size:clamp(56px,11vw,132px);font-weight:800;line-height:1.04;letter-spacing:-.03em;animation-delay:.16s}
    h1 .dot{color:var(--accent)}
    .copy{max-width:34ch;margin:0 0 38px;color:var(--muted);font-size:clamp(17px,2vw,20px);animation-delay:.24s}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:26px;animation-delay:.32s}
    .primary{display:inline-flex;min-height:54px;align-items:center;gap:12px;padding:12px 26px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;transition:transform .18s ease}
    .primary:hover{transform:translateY(-2px)}
    .quiet{font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:2px}
    footer{display:flex;justify-content:space-between;gap:16px;padding-block:22px;color:var(--muted);font-size:14px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="雾晚，返回首页"><img src="/assets/avatar.webp" alt="" width="34" height="34">雾晚</a>
  </header>
  <main>
    <p class="code rise">— 404</p>
    <h1 class="rise">走丢了<span class="dot">。</span></h1>
    <p class="copy rise">你要找的这一页不在这里，可能被移走了，也可能从来没存在过。</p>
    <div class="actions rise">
      <a class="primary" href="/">回首页 <span aria-hidden="true">→</span></a>
      <a class="quiet" href="/konbini/">或者去雨夜便利店坐坐 <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer>
    <span>雾晚</span>
    <span>stay curious.</span>
  </footer>
</body>
</html>
