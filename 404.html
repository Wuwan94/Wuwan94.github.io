<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b13">
  <meta name="robots" content="noindex">
  <meta name="description" content="这个地址没有找到；回到雾晚的个人作品集继续浏览。">
  <title>页面走丢了 — 雾晚</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#0b0b13;--ink:#f3f1f8;--muted:#b9b7c5;--accent:#a9e9f1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:0 max(24px,calc((100vw - 1240px)/2));background:var(--bg);color:var(--ink);font:400 18px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .brand{display:inline-flex;align-items:center;width:fit-content;min-height:88px;font-size:22px;font-weight:700;letter-spacing:-.05em}
    .dot{color:var(--accent)}
    main{align-self:center;width:min(680px,100%);padding-block:80px}
    .code{margin:0 0 24px;color:var(--accent);font-size:15px;font-weight:650;letter-spacing:.08em}
    h1{max-width:13ch;margin:0 0 24px;font-size:clamp(48px,8vw,88px);font-weight:500;line-height:1.02;letter-spacing:-.05em}
    .copy{max-width:36ch;margin:0 0 36px;color:var(--muted);font-size:clamp(18px,2.2vw,22px)}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:24px}
    .primary{display:inline-flex;min-height:52px;align-items:center;gap:14px;padding:12px 20px;background:var(--accent);color:#101b25;font-size:16px;font-weight:700;transition:transform .18s ease,background .18s ease}
    .primary:hover{transform:translateY(-2px);background:var(--ink)}
    .quiet{color:var(--muted);transition:color .18s ease}
    .quiet:hover{color:var(--accent)}
    footer{display:flex;justify-content:space-between;gap:16px;padding-block:24px;color:var(--muted);font-size:15px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
    @media(max-width:520px){body{font-size:17px}.brand{min-height:72px}main{padding-block:56px}.actions{gap:18px}footer{font-size:14px}}
  </style>
</head>
<body>
  <a class="brand" href="/" aria-label="雾晚，返回首页">雾晚<span class="dot">.</span></a>
  <main>
    <p class="code">404 / 没找到</p>
    <h1>这条链接，没找到。</h1>
    <p class="copy">地址可能写错了，或者页面已经搬家。回到首页，看看正在做的项目和雨夜街角。</p>
    <div class="actions">
      <a class="primary" href="/">回到首页 <span aria-hidden="true">↗</span></a>
      <a class="quiet" href="/#projects">浏览开源项目 <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer><span>雾晚 · 个人作品</span><a href="https://github.com/Wuwan94" rel="noopener noreferrer">GitHub ↗</a></footer>
</body>
</html>
